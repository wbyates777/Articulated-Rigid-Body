name: CI

on:
    push:
        branches: [ main, master ]
    pull_request:
        branches: [ main, master ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: cmake --build build --config Release

    - name: Run Checks
      run: |
          # Point to where CMake actually places the built binary
          ./build/dynamics_test
          EXIT_CODE=$?

          if [ $EXIT_CODE -eq 1 ]; then
            echo "::error::Tests failed specifically with code 1 (EXIT_FAILURE)."
            exit 1
          elif [ $EXIT_CODE -eq 2 ]; then
            echo "::error::A configuration error occurred (exit code 2)."
            exit 2
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Unexpected exit code: $EXIT_CODE"
            exit $EXIT_CODE
          else
            echo "All checks passed successfully!"
          fi
